model:
  path: "Qwen/Qwen2.5-3B-Instruct"

quant:
  enabled: False
  load_in_8bit: False #cant have both 8bit and 4bit, if both are passed as true, model is loaded in 4bits

  #4bit settings
  load_in_4bit: True
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_use_double_quant: True

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
  bias: "none"

data:
  path: "data/qwq/train"
  eval_path: "data/qwq/val"

seed: 42

train:
  epochs: 3
  per_device_train_batch_size: 3
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 3
  learning_rate: 0.00005
  lr_scheduler: "cosine"
  warmup_ratio: 0.03
  weight_decay: 0.01
  max_grad_norm: 1.0
  bf16: True
  use_gradient_checkpointing: True
  eval_steps: 100
  dataloader_num_workers: 4

ckpt:
  output_dir: "./checkpointing"
  save_steps: 100
  save_total_limit: 3

logging:
  log_steps: 10

wandb:
  enabled: True
  project: "tinyreasoner-sft"
  run_name: null  # auto-generated if null
  watch_model: True  # log gradients and model parameters
  log_model: False  # upload model checkpoints to wandb


  
